<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background Check</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f9;
    color: #1f2937;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .06);
    padding: 36px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .spinner {
    width: 44px; height: 44px;
    margin: 0 auto 18px;
    border: 4px solid #e5e7eb;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; color: #6b7280; line-height: 1.6; }
  .fallback { margin-top: 18px; font-size: 13px; }
  .fallback a { color: #2563eb; text-decoration: none; }
  .fallback a:hover { text-decoration: underline; }
  #go {
    display: inline-block;
    margin-top: 20px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #go:hover { background: #1d4ed8; }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
  }
</style>
<noscript><meta http-equiv="refresh" content="2;url=https://whitebridge.ai"></noscript>
</head>
<body>
  <main class="card">
    <div class="spinner" role="status" aria-label="Loading"></div>
    <h1>Redirecting you…</h1>
    <p>Please wait while we take you to your destination.</p>
    <button id="go" type="button">Continue</button>
    <p class="fallback">If you are not redirected automatically, <a id="manual" href="https://whitebridge.ai">click here</a>.</p>
  </main>
<script>
(function () {
  'use strict';
  var target = 'https://whitebridge.ai';
  var done = false;
  function go() {
    if (done) return;
    done = true;
    try { window.location.replace(target); }
    catch (e) { window.location.href = target; }
  }
  document.getElementById('go').addEventListener('click', go);
  document.getElementById('manual').href = target;
  setTimeout(go, 1200);
})();
</script>
</body>
</html>
