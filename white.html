<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redirecting...</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #ffffff;
            color: #222222;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            color: #666666;
            line-height: 1.6;
        }

        a {
            color: #111111;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>We are redirecting you...</h1>

    <p>
        Please wait a moment while we redirect you.
    </p>

    <p>
        If you are not redirected automatically,
        <a href="https://www.daraz.pk/">click here manually</a>.
    </p>

    <script>
        setTimeout(function () {
            window.location.href = "https://www.daraz.pk/";
        }, 1500);
    </script>

</body>
</html>
