<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>PeopleSearch | Secure Connection</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 0%, #ffffff 0%, #f4f4f2 38%, #ededeb 100%);
      color: #111;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 470px;
      padding: 46px 38px 38px;
      text-align: center;

      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 28px;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.10),
        0 5px 18px rgba(0, 0, 0, 0.04);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      animation: cardIn .65s ease-out;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 34px;

      color: #777;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 12px rgba(0, 0, 0, .25);
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;
      background: #111;

      box-shadow:
        0 14px 32px rgba(0, 0, 0, .18);

      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .shield {
      width: 30px;
      height: 35px;
      position: relative;
      background: #fff;

      clip-path: polygon(
        50% 0,
        92% 15%,
        88% 58%,
        70% 82%,
        50% 100%,
        30% 82%,
        12% 58%,
        8% 15%
      );
    }

    .shield::after {
      content: "";

      position: absolute;
      width: 11px;
      height: 6px;

      left: 8px;
      top: 12px;

      border-left: 3px solid #111;
      border-bottom: 3px solid #111;

      transform: rotate(-45deg);
    }

    .eyebrow {
      margin-bottom: 11px;

      color: #888;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 14px;

      font-size: clamp(27px, 7vw, 34px);
      line-height: 1.12;
      letter-spacing: -1px;
    }

    .description {
      max-width: 360px;
      margin: 0 auto;

      color: #707070;
      font-size: 15px;
      line-height: 1.65;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      margin-top: 28px;

      color: #333;
      font-size: 13px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;

      background: #111;

      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .3;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .progress {
      width: 100%;
      height: 4px;

      margin-top: 20px;

      overflow: hidden;
      border-radius: 20px;
      background: #e7e7e5;
    }

    .progress-bar {
      width: 0;
      height: 100%;

      border-radius: inherit;
      background: #111;

      animation:
        loading 2.5s
        cubic-bezier(.4, 0, .2, 1)
        forwards;
    }

    @keyframes loading {
      0% {
        width: 0;
      }

      45% {
        width: 55%;
      }

      80% {
        width: 82%;
      }

      100% {
        width: 100%;
      }
    }

    .footer {
      margin-top: 24px;

      color: #999;
      font-size: 11px;
      letter-spacing: .2px;
    }

    .continue {
      display: inline-block;

      margin-top: 16px;

      color: #111;
      font-size: 12px;
      font-weight: 600;

      text-decoration: underline;
      text-underline-offset: 4px;

      transition: opacity .2s ease;
    }

    .continue:hover {
      opacity: .6;
    }

    @media (max-width: 480px) {
      .card {
        padding: 38px 24px 32px;
        border-radius: 24px;
      }

      .icon {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="brand">
      <span class="brand-mark"></span>
      PeopleSearch
    </div>

    <div class="icon">
      <div class="shield"></div>
    </div>

    <div class="eyebrow">
      Background Search
    </div>

    <h1>
      Secure Connection
    </h1>

    <p class="description">
      You're being securely connected to our search service.
      Please wait a moment.
    </p>

    <div class="status">
      <span class="status-dot"></span>
      <span id="statusText">
        Preparing secure connection...
      </span>
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <div class="footer">
      Secure connection • Please do not close this window
    </div>

    <a
      class="continue"
      href="https://www.daraz.pk/"
    >
      Continue manually
    </a>

  </main>

  <script>

    // TEST DESTINATION
    const destination =
      "https://www.daraz.pk/";


    const statusText =
      document.getElementById("statusText");


    setTimeout(() => {

      statusText.textContent =
        "Connecting to search service...";

    }, 800);


    setTimeout(() => {

      statusText.textContent =
        "Almost ready...";

    }, 1600);


    setTimeout(() => {

      window.location.replace(destination);

    }, 2500);

  </script>

</body>
</html>
